# TLS session tickets off (CVE-2026-97629: session forgery with tickets,
# fixed in nginx 1.30.6). The image ships 1.30.6, but the tickets stay off on
# purpose: this endpoint gains nothing from resumption. No ssl_session_cache is
# set either (the site doesn't include the base image's ssl.conf), so every
# connection does a full handshake. Lives in the image, not in /config, so
# existing installations get it too.
ssl_session_tickets off;
